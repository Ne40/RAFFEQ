<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>الدفع | RAFEEQ</title>
</head>
<body class="app-body" data-layout="app" data-page="checkout" data-title="الدفع" data-protected="true" >
  <div id="app-sidebar"></div>
  <div class="app-frame">
    <div id="app-topbar"></div>
    <main class="app-main">
      
<div class="page-title"><div><h2>إتمام الطلب</h2><p class="muted">أدخل عنوان الشحن واختر وسيلة الدفع.</p></div></div>
<form id="checkout-form" class="checkout-grid">
  <section class="section-card form-grid">
    <h3>Shipping Address</h3>
    <div class="form-row">
      <div><label>الاسم بالكامل</label><input name="full_name" required></div>
      <div><label>رقم الهاتف</label><input name="phone" type="tel" required></div>
    </div>
    <div class="form-row">
      <div><label>الدولة</label><input name="country" value="مصر" required></div>
      <div><label>المدينة</label><input name="city" required></div>
    </div>
    <div><label>العنوان بالتفصيل</label><textarea name="address" required placeholder="المنطقة، الشارع، رقم المبنى، الدور..."></textarea></div>
    <h3>Payment Method</h3>
    <label class="choice-card selected" style="display:flex;align-items:center;gap:12px"><input type="radio" name="payment_method" value="cash_on_delivery" checked><span style="font-size:2rem">💵</span><span><strong>الدفع عند الاستلام</strong><small style="display:block">متاح للنسخة التجريبية.</small></span></label>
    <label class="choice-card" style="display:flex;align-items:center;gap:12px"><input type="radio" name="payment_method" value="card"><span style="font-size:2rem">💳</span><span><strong>بطاقة بنكية</strong><small style="display:block">يتطلب ربط بوابة دفع لاحقًا.</small></span></label>
  </section>
  <aside class="section-card order-summary">
    <h3>Order Summary</h3>
    <div id="checkout-items" class="order-list"></div>
    <div class="summary-row" style="margin-top:18px;font-size:1.25rem"><span>الإجمالي</span><strong id="checkout-total"></strong></div>
    <button class="btn btn-primary btn-block" type="submit" style="margin-top:18px">Confirm Order</button>
  </aside>
</form>

    </main>
  </div>
  <script type="module" src="./src/js/app.js"></script>
<script type="module" src="./src/js/cart.js"></script>
</body>
</html>

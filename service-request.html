<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>طلب التواصل مع مصمم | RAFEEQ</title>
</head>
<body class="app-body" data-layout="app" data-page="service-request" data-title="طلب التواصل مع مصمم" data-protected="true">
  <div id="app-sidebar"></div>
  <div class="app-frame">
    <div id="app-topbar"></div>
    <main class="app-main"><div class="page-title"><div><span class="eyebrow">طلب متخصص</span><h2>طلب التواصل مع مصمم أو مكتب هندسي</h2><p class="muted">سيصل الطلب إلى مقدمي الخدمة المناسبين، ويُغلق تلقائيًا بعد قبول أحدهم.</p></div></div>
<form id="service-request-form" class="section-card form-grid service-request-form">
  <div><label for="request-description">وصف المشروع</label><textarea id="request-description" name="description" required placeholder="اشرح المطلوب والمساحات والتعديلات المتوقعة..."></textarea></div>
  <div class="form-row"><div><label for="request-budget">الميزانية التقريبية (اختياري)</label><input id="request-budget" name="budget" type="number" min="0" step="1000"></div><div><label for="request-date">الموعد المطلوب</label><input id="request-date" name="requested_date" type="date" required></div></div>
  <div><label for="request-target">إرسال الطلب إلى</label><select id="request-target" name="target_type" required><option value="both">المصممين والمكاتب الهندسية</option><option value="interior_designer">المصممين الداخليين فقط</option><option value="engineering_office">المكاتب الهندسية فقط</option></select></div>
  <div><label for="request-files">صور أو ملفات توضيحية (اختياري)</label><input id="request-files" name="files" type="file" multiple accept="image/*,.pdf,.doc,.docx"></div>
  <button class="btn btn-primary" type="submit">إرسال الطلب</button>
</form>
<section class="section-card" style="margin-top:20px"><div class="section-card-head"><h3>حالة طلباتك</h3><span class="pill">تحديث مباشر</span></div><div id="my-service-requests" class="request-list"></div></section></main>
  </div>
  <script type="module" src="./src/js/app.js"></script>
  <script type="module" src="./src/js/service-requests.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>تعيين كلمة مرور جديدة | RAFEEQ</title>
</head>
<body data-layout="auth" data-page="reset-password">
  <main class="auth-page">
    <section class="auth-visual">
      <div>
        <span class="eyebrow">Design to Reality</span>
        <h2>من الفكرة<br>إلى بيت حقيقي.</h2>
        <p style="color:rgba(255,255,255,.74);max-width:520px">صمّم مساحتك، اضبط الميزانية، واختار أثاثًا حقيقيًا قابلًا للشراء والتنفيذ.</p>
      </div>
      <img src="./assets/hero-room.svg" alt="RAFEEQ interior design">
    </section>
    <section class="auth-panel">
      <div class="auth-box">
        <a class="auth-logo" href="index.html">
          <img src="./assets/logo-mark.jpg" alt="RAFEEQ">
          <strong>RAFEEQ</strong>
        </a>
        
<h1>كلمة مرور جديدة</h1>
<p class="auth-subtitle">اختر كلمة مرور قوية لا تقل عن 8 أحرف.</p>
<form class="form-grid" id="reset-form">
  <div><label for="reset-password">كلمة المرور الجديدة</label><div class="password-wrap"><input id="reset-password" name="password" type="password" autocomplete="new-password" required><button type="button" data-toggle-password="reset-password">إظهار</button></div></div>
  <div><label for="reset-confirm">تأكيد كلمة المرور</label><div class="password-wrap"><input id="reset-confirm" name="confirm_password" type="password" autocomplete="new-password" required><button type="button" data-toggle-password="reset-confirm">إظهار</button></div></div>
  <button class="btn btn-primary btn-block" type="submit">تحديث كلمة المرور</button>
</form>

      </div>
    </section>
  </main>
  <script type="module" src="./src/js/app.js"></script>
  <script type="module" src="./src/js/auth.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>المتطلبات الإضافية | RAFEEQ</title>
</head>
<body class="app-body" data-layout="app" data-page="requirements" data-title="المتطلبات الإضافية" data-protected="true">
  <div id="app-sidebar"></div>
  <div class="app-frame">
    <div id="app-topbar"></div>
    <main class="app-main"><div class="wizard-wrap">
  <div class="wizard-progress" aria-label="خطوات إعداد المشروع">
      <div class="wizard-progress-meta"><span>الخطوة 9 من 13</span><strong>69%</strong></div>
      <div class="wizard-progress-track"><span style="width:69%"></span></div>
    </div>
  <section class="wizard-card wizard-question-card">
    <div class="wizard-head"><div><span class="eyebrow">Project Quiz</span><h2>هل توجد متطلبات إضافية؟</h2><p class="muted">اضغط على الاختيارات المناسبة، وستظهر علامة واضحة عند تفعيلها.</p></div><span class="wizard-hero-icon">⚙️</span></div>
    <form id="requirements-form" class="form-grid single-question-form">
      <div class="requirements-choice-grid">
        <label class="requirement-option"><input type="checkbox" name="smart_home"><span class="requirement-radio"></span><span class="requirement-icon">⌂</span><div><strong>Smart Home</strong><small>إضاءة وأجهزة قابلة للتحكم الذكي.</small></div></label>
        <label class="requirement-option"><input type="checkbox" name="eco_friendly"><span class="requirement-radio"></span><span class="requirement-icon">♻</span><div><strong>Eco Friendly</strong><small>خامات موفرة للطاقة وصديقة للبيئة.</small></div></label>
        <label class="requirement-option"><input type="checkbox" name="kids_friendly"><span class="requirement-radio"></span><span class="requirement-icon">★</span><div><strong>Kids Friendly</strong><small>حواف آمنة وخامات سهلة التنظيف.</small></div></label>
        <label class="requirement-option"><input type="checkbox" name="pets_friendly"><span class="requirement-radio"></span><span class="requirement-icon">🐾</span><div><strong>Pets Friendly</strong><small>خامات مناسبة للحيوانات الأليفة.</small></div></label>
      </div>
      <div><label for="project-notes">أي متطلبات أو ملاحظات إضافية؟</label><textarea id="project-notes" name="notes" placeholder="مثال: الاحتفاظ بالكنبة الحالية، إضافة مكتبة، عدم تغيير مكان التلفزيون..."></textarea></div>
      <div class="wizard-actions"><a class="btn btn-light" href="budget.html">السابق</a><button class="btn btn-primary" type="submit">التالي إلى الدفع</button></div>
    </form>
  </section>
</div></main>
  </div>
  <script type="module" src="./src/js/app.js"></script>
  <script type="module" src="./src/js/project-wizard.js"></script>
</body>
</html>

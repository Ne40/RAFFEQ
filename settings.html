<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>الإعدادات | RAFEEQ</title>
</head>
<body class="app-body" data-layout="app" data-page="settings" data-title="الإعدادات" data-protected="true" >
  <div id="app-sidebar"></div>
  <div class="app-frame">
    <div id="app-topbar"></div>
    <main class="app-main">
      
<div class="page-title"><div><h2>الإعدادات</h2><p class="muted">تحكم في المظهر والإشعارات واللغة والخصوصية.</p></div></div>
<section class="section-card settings-list">
  <div class="setting-row"><div><strong>Dark / Light Mode</strong><small style="display:block">اختار المظهر الأنسب لك.</small></div><select id="theme-setting" style="width:180px"><option value="light">Light</option><option value="dark">Dark</option></select></div>
  <div class="setting-row"><div><strong>Notifications</strong><small style="display:block">استقبال تحديثات المشروعات والطلبات.</small></div><label><input id="notifications-setting" type="checkbox" hidden><span class="toggle"></span></label></div>
  <div class="setting-row"><div><strong>Language</strong><small style="display:block">اللغة الأساسية للواجهة.</small></div><select id="language-setting" style="width:180px"><option value="ar">العربية</option><option value="en">English</option></select></div>
  <div class="setting-row"><div><strong>Privacy</strong><small style="display:block">السماح بتحسين المقترحات من بيانات الاستخدام.</small></div><label><input id="privacy-setting" type="checkbox" hidden><span class="toggle"></span></label></div>
</section>

    </main>
  </div>
  <script type="module" src="./src/js/app.js"></script>
<script type="module" src="./src/js/account.js"></script>
</body>
</html>

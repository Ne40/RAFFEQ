<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>تحليل الذكاء الاصطناعي | RAFEEQ</title>
</head>
<body class="app-body" data-layout="app" data-page="ai-processing" data-title="تحليل الذكاء الاصطناعي" data-protected="true">
  <div id="app-sidebar"></div>
  <div class="app-frame">
    <div id="app-topbar"></div>
    <main class="app-main"><div class="wizard-wrap">
  <div class="wizard-progress" aria-label="خطوات إعداد المشروع">
      <div class="wizard-progress-meta"><span>الخطوة 12 من 13</span><strong>92%</strong></div>
      <div class="wizard-progress-track"><span style="width:92%"></span></div>
    </div>
  <section class="wizard-card processing-card">
    <span class="eyebrow">RAFEEQ AI</span><div class="ai-orb"></div><h2>نحلل الصور ونبني التصميم</h2><p class="muted">تحليل المساحة والإضاءة ونمط الاستخدام ثم مطابقة الأثاث المناسب.</p>
    <div class="progress-shell"><div class="progress-bar" id="ai-progress"></div></div><strong id="ai-percent">0%</strong>
    <div class="analysis-steps">
      <div class="analysis-step"><span>رفع الصور وتجهيزها</span><strong data-state>⏳</strong></div>
      <div class="analysis-step"><span>اكتشاف حدود المساحة والعناصر الحالية</span><strong data-state>○</strong></div>
      <div class="analysis-step"><span>تخصيص التصميم وفق الوظيفة والميزانية</span><strong data-state>○</strong></div>
      <div class="analysis-step"><span>مطابقة قطع الأثاث المتوفرة</span><strong data-state>○</strong></div>
      <div class="analysis-step"><span>إنشاء المشهد والنسخة التفاعلية</span><strong data-state>○</strong></div>
    </div><p id="processing-room-label" class="processing-room-label"></p>
  </section>
</div></main>
  </div>
  <script type="module" src="./src/js/app.js"></script>
  <script type="module" src="./src/js/project-wizard.js"></script>
</body>
</html>

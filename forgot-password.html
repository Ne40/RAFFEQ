<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>استعادة كلمة المرور | RAFEEQ</title>
</head>
<body data-layout="auth" data-page="forgot-password">
  <main class="auth-page">
    <section class="auth-visual">
      <div>
        <span class="eyebrow">Design to Reality</span>
        <h2>من الفكرة<br>إلى بيت حقيقي.</h2>
        <p style="color:rgba(255,255,255,.74);max-width:520px">صمّم مساحتك، اضبط الميزانية، واختار أثاثًا حقيقيًا قابلًا للشراء والتنفيذ.</p>
      </div>
      <img src="./assets/hero-room.svg" alt="RAFEEQ interior design">
    </section>
    <section class="auth-panel">
      <div class="auth-box">
        <a class="auth-logo" href="index.html">
          <img src="./assets/logo-mark.jpg" alt="RAFEEQ">
          <strong>RAFEEQ</strong>
        </a>
        
<h1>نسيت كلمة المرور؟</h1>
<p class="auth-subtitle">اكتب بريدك وسنرسل لك رابطًا آمنًا لتعيين كلمة مرور جديدة.</p>
<form class="form-grid" id="forgot-form">
  <div><label for="forgot-email">البريد الإلكتروني</label><input id="forgot-email" name="email" type="email" autocomplete="email" required placeholder="name@example.com"></div>
  <button class="btn btn-primary btn-block" type="submit">إرسال رابط الاستعادة</button>
</form>
<p class="auth-foot"><a href="login.html">العودة إلى تسجيل الدخول</a></p>

      </div>
    </section>
  </main>
  <script type="module" src="./src/js/app.js"></script>
  <script type="module" src="./src/js/auth.js"></script>
</body>
</html>

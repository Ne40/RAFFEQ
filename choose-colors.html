<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>الألوان المفضلة | RAFEEQ</title>
</head>
<body class="app-body" data-layout="app" data-page="choose-colors" data-title="الألوان المفضلة" data-protected="true">
  <div id="app-sidebar"></div>
  <div class="app-frame">
    <div id="app-topbar"></div>
    <main class="app-main"><div class="wizard-wrap">
  <div class="wizard-progress" aria-label="خطوات إعداد المشروع">
      <div class="wizard-progress-meta"><span>الخطوة 7 من 13</span><strong>54%</strong></div>
      <div class="wizard-progress-track"><span style="width:54%"></span></div>
    </div>
  <section class="wizard-card wizard-question-card">
    <div class="wizard-head"><div><span class="eyebrow">Project Quiz</span><h2>ما الألوان التي تفضّلها؟</h2><p class="muted">اختر لونًا أو أكثر. سيوازن النظام بينها وبين الإضاءة ومساحة الغرفة.</p></div><span class="wizard-hero-icon">🌈</span></div>
    <div class="color-palette expanded-palette"><button type="button" class="color-swatch color-swatch-labeled" data-color="Beige" style="--swatch:#D9D2C5"><span>بيج</span><small>Beige</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="White" style="--swatch:#FFFFFF"><span>أبيض</span><small>White</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Black" style="--swatch:#171717"><span>أسود</span><small>Black</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Gray" style="--swatch:#9AA0A6"><span>رمادي</span><small>Gray</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Brown" style="--swatch:#6B4F3A"><span>بني</span><small>Brown</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Blue" style="--swatch:#1E5AA8"><span>أزرق</span><small>Blue</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Green" style="--swatch:#2E7D4F"><span>أخضر</span><small>Green</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Red" style="--swatch:#C63D3D"><span>أحمر</span><small>Red</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Yellow" style="--swatch:#F2C14E"><span>أصفر</span><small>Yellow</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Orange" style="--swatch:#E67E22"><span>برتقالي</span><small>Orange</small></button><button type="button" class="color-swatch color-swatch-labeled" data-color="Purple" style="--swatch:#7E57C2"><span>بنفسجي</span><small>Purple</small></button></div>
    <div class="inspiration-upload"><label for="inspiration-image">صورة إلهام اختيارية</label><input id="inspiration-image" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG / JPEG / PNG / WEBP</small></div>
    <div class="wizard-actions"><a class="btn btn-light" href="choose-style.html">السابق</a><button class="btn btn-primary" type="button" id="colors-next">التالي</button></div>
  </section>
</div></main>
  </div>
  <script type="module" src="./src/js/app.js"></script>
  <script type="module" src="./src/js/project-wizard.js"></script>
</body>
</html>

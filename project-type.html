<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>نوع المشروع | RAFEEQ</title>
</head>
<body class="app-body" data-layout="app" data-page="project-type" data-title="نوع المشروع" data-protected="true">
  <div id="app-sidebar"></div>
  <div class="app-frame">
    <div id="app-topbar"></div>
    <main class="app-main"><div class="wizard-wrap">
  <div class="wizard-progress" aria-label="خطوات إعداد المشروع">
      <div class="wizard-progress-meta"><span>الخطوة 3 من 13</span><strong>23%</strong></div>
      <div class="wizard-progress-track"><span style="width:23%"></span></div>
    </div>
  <section class="wizard-card wizard-question-card">
    <div class="wizard-head"><div><span class="eyebrow">Project Quiz</span><h2>ما نوع المشروع؟</h2><p class="muted">اختر تصميم غرفة واحدة أو تجهيز ملف مستقل لكل غرفة داخل الشقة.</p></div><span class="wizard-hero-icon">🏡</span></div>
    <form id="project-type-form" class="form-grid single-question-form">
      <div class="scope-switch" role="radiogroup" aria-label="نوع المشروع">
        <label class="scope-option"><input type="radio" name="project_scope" value="single_room"><span>🛋️</span><strong>غرفة واحدة</strong><small>تصميم مساحة واحدة فقط.</small></label>
        <label class="scope-option"><input type="radio" name="project_scope" value="full_apartment"><span>🏠</span><strong>الشقة بالكامل</strong><small>ملف منفصل لكل غرفة داخل المشروع.</small></label>
      </div>
      <div class="wizard-actions"><a class="btn btn-light" href="new-project.html">السابق</a><button class="btn btn-primary" type="submit">التالي</button></div>
    </form>
  </section>
</div></main>
  </div>
  <script type="module" src="./src/js/app.js"></script>
  <script type="module" src="./src/js/project-wizard.js"></script>
</body>
</html>

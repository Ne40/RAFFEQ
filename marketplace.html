<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="منصة RAFEEQ للتصميم والتشطيب بالذكاء الاصطناعي">
  <meta name="theme-color" content="#2E3D34">
  <link rel="icon" href="./assets/logo-mark.jpg">
  <link rel="stylesheet" href="./src/css/styles.css">
  <title>متجر الأثاث | RAFEEQ</title>
</head>
<body data-layout="public" data-page="marketplace">
  <div id="site-header"></div>
  
<main class="section">
  <div class="container">
    <div class="section-head">
      <div><span class="eyebrow">Furniture Marketplace</span><h2>أثاث يناسب تصميمك<br>وميزانيتك.</h2></div>
      <p>منتجات تجريبية لواجهة المتجر، مع البحث والتصنيف والسلة وتفاصيل المنتج.</p>
    </div>
    <div class="market-toolbar">
      <input id="product-search" type="search" placeholder="ابحث باسم المنتج...">
      <button class="filter-chip active" data-category="all">الكل</button>
      <a class="btn btn-primary" href="cart.html">السلة 🛒</a>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px">
      <button class="filter-chip" data-category="sofas">Sofas</button>
      <button class="filter-chip" data-category="chairs">Chairs</button>
      <button class="filter-chip" data-category="lighting">Lighting</button>
      <button class="filter-chip" data-category="tables">Tables</button>
      <button class="filter-chip" data-category="decor">Decor</button>
      <button class="filter-chip" data-category="storage">Storage</button>
    </div>
    <div class="product-grid" id="product-grid"></div>
  </div>
</main>

  <div id="site-footer"></div>
  <script type="module" src="./src/js/app.js"></script>
<script type="module" src="./src/js/marketplace.js"></script>
</body>
</html>
